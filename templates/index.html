<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KotakScanner</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071018;color:#edf4f8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#071018,#0c1824);min-height:100vh}main{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}h1{font-size:22px;margin:0}.sub,.status,.muted{color:#8da2b3;font-size:12px}.card{background:#101d29;border:1px solid #1e3445;border-radius:16px;padding:14px;margin-bottom:14px}.controls{display:grid;grid-template-columns:1fr 1fr 110px 90px;gap:8px}input,select,button{width:100%;border:1px solid #2a4356;background:#0a151f;color:#edf4f8;border-radius:10px;padding:11px;font-size:14px}button{background:#1d75d2;border:0;font-weight:700}.stop{background:#374858}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#788b99;margin-right:6px}.live{background:#36d399}#chart{height:470px;width:100%}.signal{display:flex;justify-content:space-between;align-items:center}.pattern{font-size:20px;font-weight:800}.price{font-size:25px;font-weight:800}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#183047;color:#91c8ff}@media(max-width:700px){main{padding:10px}.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:span 2}#chart{height:390px}}
</style></head><body><main>
<div class="top"><div><h1>📈 KotakScanner</h1><div class="sub">Live candles + candlestick pattern detection</div></div><span class="badge">NO ORDERS</span></div>
<section class="card"><div class="controls"><input id="segment" value="nse_cm" placeholder="Segment"><input id="token" placeholder="Instrument token"><select id="interval"><option value="1min">1 min</option><option value="3min">3 min</option><option value="5min" selected>5 min</option><option value="10min">10 min</option><option value="15min">15 min</option><option value="30min">30 min</option><option value="60min">60 min</option></select><button id="connect">CONNECT</button></div><div class="status" style="margin-top:10px"><span id="dot" class="dot"></span><span id="status">Enter a Kotak instrument token.</span></div></section>
<section class="card signal"><div><div class="muted">Detected pattern</div><div id="pattern" class="pattern">—</div></div><div style="text-align:right"><div class="muted">LTP</div><div id="price" class="price">—</div></div></section>
<section class="card"><div id="chart"></div></section></main>
<script>
const chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#101d29'},textColor:'#9fb2c1'},grid:{vertLines:{color:'#183040'},horzLines:{color:'#183040'}},rightPriceScale:{borderColor:'#294354'},timeScale:{borderColor:'#294354',timeVisible:true,secondsVisible:false}});
const series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#20c997',downColor:'#ff6677',borderVisible:false,wickUpColor:'#20c997',wickDownColor:'#ff6677'});let socket;
function render(cs){series.setData(cs.map(c=>({time:Math.floor(new Date(c.time).getTime()/1000),open:+c.open,high:+c.high,low:+c.low,close:+c.close})));chart.timeScale().fitContent()}
function state(ok,msg){document.getElementById('dot').className='dot '+(ok?'live':'');document.getElementById('status').textContent=msg}
document.getElementById('connect').onclick=()=>{if(socket){socket.close();socket=null;return}const seg=document.getElementById('segment').value.trim(),tok=document.getElementById('token').value.trim(),intv=document.getElementById('interval').value;if(!tok)return state(false,'Instrument token is required.');socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?segment='+encodeURIComponent(seg)+'&token='+encodeURIComponent(tok)+'&interval='+intv);document.getElementById('connect').textContent='STOP';document.getElementById('connect').className='stop';state(false,'Connecting to Kotak Neo…');socket.onopen=()=>state(true,'Live feed connected');socket.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='error'){state(false,d.message);return}if(d.candles)render(d.candles);if(d.pattern)document.getElementById('pattern').textContent=d.pattern;if(d.price)document.getElementById('price').textContent=Number(d.price).toFixed(2);if(d.status)state(true,d.status+' candle')};socket.onerror=()=>state(false,'WebSocket error');socket.onclose=()=>{socket=null;document.getElementById('connect').textContent='CONNECT';document.getElementById('connect').className='';}};window.addEventListener('resize',()=>chart.applyOptions({width:document.getElementById('chart').clientWidth}));
</script></body></html>
